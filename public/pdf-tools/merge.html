<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge PDF | Visafy</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .file-item.dragging { opacity: 0.5; border: 2px dashed var(--primary); }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="logo">Visafy ✈️</a>
        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="../checklist/index.html">Checklists</a></li>
        </ul>
    </nav>

    <main class="container">
        <div style="margin-bottom: 2rem; text-align: center;">
            <h2 class="section-title">Merge PDF Documents</h2>
            <p>Combine multiple PDFs into one. Drag and drop the list to reorder files before merging.</p>
        </div>

        <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <div class="upload-area-icon">🔗</div>
            <h3>Click or Drag PDFs Here</h3>
            <p>Upload 2 or more files to merge</p>
            <input type="file" id="fileInput" multiple accept="application/pdf">
        </div>

        <div class="workspace" id="workspace" style="display: none; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3>Selected Files <span style="font-size: 0.9rem; color: #666;">(Drag to reorder)</span></h3>
                <button class="btn btn-primary" id="mergeBtn">Merge All Files</button>
            </div>
            
            <div class="file-list" id="fileList">
                </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Visafy Platform. All rights reserved.</p>
    </footer>

    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="../js/main.js"></script>
    
    <script>
        const { PDFDocument } = PDFLib;
        
        let filesArray = [];
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileList = document.getElementById('fileList');
        const workspace = document.getElementById('workspace');

        // Drag & Drop Upload
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        function handleFiles(files) {
            const validFiles = Array.from(files).filter(f => f.type === 'application/pdf');
            if (validFiles.length === 0) return window.showToast('Please upload valid PDF files', 'error');
            
            filesArray = [...filesArray, ...validFiles];
            renderFileList();
        }

        function renderFileList() {
            if (filesArray.length > 0) {
                dropZone.style.display = 'none';
                workspace.style.display = 'flex';
            }
            
            fileList.innerHTML = '';
            filesArray.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.draggable = true;
                item.dataset.index = index;
                item.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span style="cursor: grab;">☰</span>
                        <strong>${file.name}</strong>
                    </div>
                    <div>
                        <span style="color: #666; margin-right: 15px;">${window.formatFileSize(file.size)}</span>
                        <button class="btn btn-danger" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;" onclick="removeFile(${index})">X</button>
                    </div>
                `;
                
                // HTML5 Native Drag & Drop for reordering
                item.addEventListener('dragstart', handleDragStart);
                item.addEventListener('dragover', handleDragOver);
                item.addEventListener('drop', handleDrop);
                item.addEventListener('dragend', handleDragEnd);
                
                fileList.appendChild(item);
            });
        }

        window.removeFile = function(index) {
            filesArray.splice(index, 1);
            if (filesArray.length === 0) {
                workspace.style.display = 'none';
                dropZone.style.display = 'block';
            } else {
                renderFileList();
            }
        };

        // Reordering Logic
        let dragStartIndex;
        function handleDragStart(e) {
            dragStartIndex = +this.dataset.index;
            this.classList.add('dragging');
        }
        function handleDragOver(e) { e.preventDefault(); }
        function handleDrop(e) {
            e.preventDefault();
            const dragEndIndex = +this.dataset.index;
            // Swap array elements
            const item = filesArray.splice(dragStartIndex, 1)[0];
            filesArray.splice(dragEndIndex, 0, item);
            renderFileList();
        }
        function handleDragEnd() { this.classList.remove('dragging'); }

        // PDF Merging execution
        document.getElementById('mergeBtn').addEventListener('click', async () => {
            if (filesArray.length < 2) return window.showToast('Need at least 2 files to merge', 'warning');
            
            window.showSpinner('Merging PDFs...');
            try {
                const mergedPdf = await PDFDocument.create();
                
                for (let file of filesArray) {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await PDFDocument.load(arrayBuffer);
                    const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                    copiedPages.forEach((page) => mergedPdf.addPage(page));
                }

                const pdfBytes = await mergedPdf.save();
                saveAs(new Blob([pdfBytes], { type: 'application/pdf' }), 'merged_visafy.pdf');
                window.showToast('Merged Successfully!');
            } catch (error) {
                console.error(error);
                window.showToast('Error merging files', 'error');
            }
            window.hideSpinner();
        });
    </script>
</body>
</html>
