<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Numbers - Visafy</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-tool="pageNumbersPdf">
  <header class="site-header"><nav class="navbar"><a class="logo" href="../index.html">Visafy ✈️</a><div class="nav-links"><a href="../index.html">Home</a><a href="../index.html#pdf-tools">PDF Tools</a><a href="../index.html#photo-tools">Photo Tools</a><a href="../checklist/index.html">Visa Checklist</a></div></nav></header>
  <main>
    <section class="tool-hero"><div class="container"><h1>Page Numbers</h1><p>Add simple page numbers to every page.</p></div></section>
    <section class="tool-shell"><div class="container tool-layout">
      <div class="tool-panel">
        <h2>Upload PDF</h2>
        <div id="numbersDrop" class="upload-zone"><div><strong>Choose one PDF</strong><span>Numbers are drawn onto each page</span></div></div>
        <input id="numbersInput" class="hidden-input" type="file" accept=".pdf,application/pdf">
        <div id="numbersList" class="file-list"></div>
        <div class="controls">
          <div class="form-group"><label for="numbersPosition">Position</label><select id="numbersPosition"><option value="bottom-center">Bottom Center</option><option value="bottom-right">Bottom Right</option><option value="top-right">Top Right</option></select></div>
          <div class="form-row"><div class="form-group"><label for="numbersStart">Starting number</label><input id="numbersStart" type="number" min="1" value="1"></div><div class="form-group"><label for="numbersSize">Font size</label><input id="numbersSize" type="number" min="6" value="12"></div></div>
          <button id="numbersButton" class="btn" type="button">Add Page Numbers</button>
        </div>
      </div>
      <div class="preview-panel"><h2>Status</h2><div class="status-box"><strong id="numbersStatus">No PDF selected.</strong><span>Output downloads as page-numbers.pdf.</span></div></div>
    </div></section>
  </main>
  <footer class="site-footer"><div class="container">© 2025 Visafy. All rights reserved.</div></footer>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
