<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reorder PDF - Visafy</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-tool="reorderPdf">
  <header class="site-header"><nav class="navbar"><a class="logo" href="../index.html">Visafy ✈️</a><div class="nav-links"><a href="../index.html">Home</a><a href="../index.html#pdf-tools">PDF Tools</a><a href="../index.html#photo-tools">Photo Tools</a><a href="../checklist/index.html">Visa Checklist</a></div></nav></header>
  <main>
    <section class="tool-hero"><div class="container"><h1>Reorder PDF</h1><p>Render page thumbnails, drag them into order, then download a reordered PDF.</p></div></section>
    <section class="tool-shell"><div class="container tool-layout">
      <div class="tool-panel">
        <h2>Upload PDF</h2>
        <div id="reorderDrop" class="upload-zone"><div><strong>Choose one PDF</strong><span>All pages render as draggable thumbnails</span></div></div>
        <input id="reorderInput" class="hidden-input" type="file" accept=".pdf,application/pdf">
        <div id="reorderList" class="file-list"></div>
        <div class="controls"><button id="reorderButton" class="btn" type="button">Download Reordered PDF</button></div>
      </div>
      <div class="preview-panel"><h2>Pages</h2><div id="reorderGrid" class="thumbnail-grid"></div><div class="status-box"><strong id="reorderStatus">No PDF selected.</strong></div></div>
    </div></section>
  </main>
  <footer class="site-footer"><div class="container">© 2025 Visafy. All rights reserved.</div></footer>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
