<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF to JPG - Visafy</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-tool="pdfToJpg">
  <header class="site-header"><nav class="navbar"><a class="logo" href="../index.html">Visafy ✈️</a><div class="nav-links"><a href="../index.html">Home</a><a href="../index.html#pdf-tools">PDF Tools</a><a href="../index.html#photo-tools">Photo Tools</a><a href="../checklist/index.html">Visa Checklist</a></div></nav></header>
  <main>
    <section class="tool-hero"><div class="container"><h1>PDF to JPG</h1><p>Render each PDF page into a JPG image. Multi-page PDFs download as a ZIP.</p></div></section>
    <section class="tool-shell"><div class="container tool-layout">
      <div class="tool-panel">
        <h2>Upload PDF</h2>
        <div id="pdfJpgDrop" class="upload-zone"><div><strong>Choose one PDF</strong><span>Exports JPG at high quality</span></div></div>
        <input id="pdfJpgInput" class="hidden-input" type="file" accept=".pdf,application/pdf">
        <div id="pdfJpgList" class="file-list"></div>
        <div class="controls"><button id="pdfJpgButton" class="btn" type="button">Convert to JPG</button></div>
      </div>
      <div class="preview-panel"><h2>Status</h2><div class="status-box"><strong id="pdfJpgStatus">No PDF selected.</strong></div></div>
    </div></section>
  </main>
  <footer class="site-footer"><div class="container">© 2025 Visafy. All rights reserved.</div></footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
