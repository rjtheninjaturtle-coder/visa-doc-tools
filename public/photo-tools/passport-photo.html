<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passport Photo - Visafy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-tool="passportPhoto">
  <header class="site-header"><nav class="navbar"><a class="logo" href="../index.html">Visafy ✈️</a><div class="nav-links"><a href="../index.html">Home</a><a href="../index.html#pdf-tools">PDF Tools</a><a href="../index.html#photo-tools">Photo Tools</a><a href="../checklist/index.html">Visa Checklist</a></div></nav></header>
  <main>
    <section class="tool-hero"><div class="container"><h1>Passport Photo</h1><p>Crop a visa photo to exact country pixel dimensions and export as JPEG.</p></div></section>
    <section class="tool-shell"><div class="container tool-layout">
      <div class="tool-panel">
        <h2>Upload Photo</h2>
        <div id="passportDrop" class="upload-zone"><div><strong>Choose an image</strong><span>JPG, PNG, or any browser-supported image</span></div></div>
        <input id="passportInput" class="hidden-input" type="file" accept="image/*">
        <div class="controls">
          <div class="form-group"><label for="passportCountry">Country size</label><select id="passportCountry"><option>USA</option><option>UK</option><option>Schengen</option><option>India</option><option>Canada</option><option>Australia</option><option>Dubai</option><option>Singapore</option><option>Japan</option><option>China</option></select></div>
          <div class="button-row"><button id="applyPassportSize" class="btn secondary" type="button">Apply Dimensions</button><button id="passportWhiteBg" class="btn secondary" type="button">White Background</button></div>
          <button id="passportDownload" class="btn" type="button">Download Photo</button>
        </div>
      </div>
      <div class="preview-panel"><h2>Preview</h2><div class="preview-area"><img id="passportImage" alt="Passport crop preview"></div><div class="status-box"><strong id="passportStatus">No image selected.</strong></div></div>
    </div></section>
  </main>
  <footer class="site-footer"><div class="container">© 2025 Visafy. All rights reserved.</div></footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
