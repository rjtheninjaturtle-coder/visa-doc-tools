<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Text to Image - Visafy</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-tool="addTextImage">
  <header class="site-header"><nav class="navbar"><a class="logo" href="../index.html">Visafy ✈️</a><div class="nav-links"><a href="../index.html">Home</a><a href="../index.html#pdf-tools">PDF Tools</a><a href="../index.html#photo-tools">Photo Tools</a><a href="../checklist/index.html">Visa Checklist</a></div></nav></header>
  <main>
    <section class="tool-hero"><div class="container"><h1>Add Text to Image</h1><p>Add custom text to an image with live preview.</p></div></section>
    <section class="tool-shell"><div class="container tool-layout">
      <div class="tool-panel">
        <h2>Upload Image</h2>
        <div id="addTextImageDrop" class="upload-zone"><div><strong>Choose an image</strong><span>Text updates as you type</span></div></div>
        <input id="addTextImageInput" class="hidden-input" type="file" accept="image/*">
        <div class="controls">
          <div class="form-group"><label for="imageTextContent">Text</label><input id="imageTextContent" type="text" value="Visa copy"></div>
          <div class="form-row"><div class="form-group"><label for="imageTextSize">Font size</label><input id="imageTextSize" type="number" min="8" value="48"></div><div class="form-group"><label for="imageTextColor">Color</label><input id="imageTextColor" type="color" value="#1a237e"></div></div>
          <div class="checkbox-row"><label><input id="imageTextBold" type="checkbox" checked> Bold</label></div>
          <div class="form-group"><label for="imageTextX">X position</label><input id="imageTextX" type="range" min="0" max="100" value="10"></div>
          <div class="form-group"><label for="imageTextY">Y position</label><input id="imageTextY" type="range" min="0" max="100" value="10"></div>
          <button id="addTextImageDownload" class="btn" type="button">Download Image</button>
        </div>
      </div>
      <div class="preview-panel"><h2>Preview</h2><div class="preview-area"><canvas id="addTextImageCanvas"></canvas></div><div class="status-box"><strong id="addTextImageStatus">No image selected.</strong></div></div>
    </div></section>
  </main>
  <footer class="site-footer"><div class="container">© 2025 Visafy. All rights reserved.</div></footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
