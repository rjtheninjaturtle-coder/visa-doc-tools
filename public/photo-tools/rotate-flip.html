<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotate and Flip Image - Visafy</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-tool="rotateFlip">
  <header class="site-header"><nav class="navbar"><a class="logo" href="../index.html">Visafy ✈️</a><div class="nav-links"><a href="../index.html">Home</a><a href="../index.html#pdf-tools">PDF Tools</a><a href="../index.html#photo-tools">Photo Tools</a><a href="../checklist/index.html">Visa Checklist</a></div></nav></header>
  <main>
    <section class="tool-hero"><div class="container"><h1>Rotate & Flip</h1><p>Rotate images left or right and flip them horizontally or vertically.</p></div></section>
    <section class="tool-shell"><div class="container tool-layout">
      <div class="tool-panel">
        <h2>Upload Image</h2>
        <div id="rotateFlipDrop" class="upload-zone"><div><strong>Choose an image</strong><span>Edits apply to the current preview</span></div></div>
        <input id="rotateFlipInput" class="hidden-input" type="file" accept="image/*">
        <div class="controls">
          <div class="button-row"><button id="rotateLeft" class="btn secondary" type="button">Rotate Left</button><button id="rotateRight" class="btn secondary" type="button">Rotate Right</button><button id="flipHorizontal" class="btn secondary" type="button">Flip Horizontal</button><button id="flipVertical" class="btn secondary" type="button">Flip Vertical</button></div>
          <button id="rotateFlipDownload" class="btn" type="button">Download Image</button>
        </div>
      </div>
      <div class="preview-panel"><h2>Preview</h2><div class="preview-area"><canvas id="rotateFlipCanvas"></canvas></div><div class="status-box"><strong id="rotateFlipStatus">No image selected.</strong></div></div>
    </div></section>
  </main>
  <footer class="site-footer"><div class="container">© 2025 Visafy. All rights reserved.</div></footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
