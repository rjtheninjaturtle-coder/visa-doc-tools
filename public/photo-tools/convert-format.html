<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convert Image Format - Visafy</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-tool="convertFormat">
  <header class="site-header"><nav class="navbar"><a class="logo" href="../index.html">Visafy ✈️</a><div class="nav-links"><a href="../index.html">Home</a><a href="../index.html#pdf-tools">PDF Tools</a><a href="../index.html#photo-tools">Photo Tools</a><a href="../checklist/index.html">Visa Checklist</a></div></nav></header>
  <main>
    <section class="tool-hero"><div class="container"><h1>Convert Format</h1><p>Convert a browser-supported image to JPG, PNG, or WEBP.</p></div></section>
    <section class="tool-shell"><div class="container tool-layout">
      <div class="tool-panel">
        <h2>Upload Image</h2>
        <div id="convertDrop" class="upload-zone"><div><strong>Choose an image</strong><span>Then select an output format</span></div></div>
        <input id="convertInput" class="hidden-input" type="file" accept="image/*">
        <div class="controls">
          <div class="form-group"><label for="convertFormat">Output format</label><select id="convertFormat"><option value="jpg">JPG</option><option value="png">PNG</option><option value="webp">WEBP</option></select></div>
          <button id="convertButton" class="btn" type="button">Convert & Download</button>
        </div>
      </div>
      <div class="preview-panel"><h2>Preview</h2><div class="preview-area"><canvas id="convertCanvas"></canvas></div><div class="status-box"><strong id="convertStatus">No image selected.</strong></div></div>
    </div></section>
  </main>
  <footer class="site-footer"><div class="container">© 2025 Visafy. All rights reserved.</div></footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
