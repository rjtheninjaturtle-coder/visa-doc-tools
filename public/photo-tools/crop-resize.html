<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crop and Resize - Visafy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-tool="cropResize">
  <header class="site-header"><nav class="navbar"><a class="logo" href="../index.html">Visafy ✈️</a><div class="nav-links"><a href="../index.html">Home</a><a href="../index.html#pdf-tools">PDF Tools</a><a href="../index.html#photo-tools">Photo Tools</a><a href="../checklist/index.html">Visa Checklist</a></div></nav></header>
  <main>
    <section class="tool-hero"><div class="container"><h1>Crop & Resize</h1><p>Crop an image and export it at exact width and height.</p></div></section>
    <section class="tool-shell"><div class="container tool-layout">
      <div class="tool-panel">
        <h2>Upload Image</h2>
        <div id="cropResizeDrop" class="upload-zone"><div><strong>Choose an image</strong><span>Use the crop box in the preview</span></div></div>
        <input id="cropResizeInput" class="hidden-input" type="file" accept="image/*">
        <div class="controls">
          <div class="form-row"><div class="form-group"><label for="resizeWidth">Width</label><input id="resizeWidth" type="number" min="1" value="800"></div><div class="form-group"><label for="resizeHeight">Height</label><input id="resizeHeight" type="number" min="1" value="600"></div></div>
          <div class="checkbox-row"><label><input id="lockAspect" type="checkbox" checked> Lock aspect ratio</label></div>
          <button id="cropResizeDownload" class="btn" type="button">Download Image</button>
        </div>
      </div>
      <div class="preview-panel"><h2>Preview</h2><div class="preview-area"><img id="cropResizeImage" alt="Crop and resize preview"></div><div class="status-box"><strong id="cropResizeStatus">No image selected.</strong></div></div>
    </div></section>
  </main>
  <footer class="site-footer"><div class="container">© 2025 Visafy. All rights reserved.</div></footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
