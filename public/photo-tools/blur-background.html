<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blur Background - Visafy</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-tool="blurBackground">
  <header class="site-header"><nav class="navbar"><a class="logo" href="../index.html">Visafy ✈️</a><div class="nav-links"><a href="../index.html">Home</a><a href="../index.html#pdf-tools">PDF Tools</a><a href="../index.html#photo-tools">Photo Tools</a><a href="../checklist/index.html">Visa Checklist</a></div></nav></header>
  <main>
    <section class="tool-hero"><div class="container"><h1>Blur Background</h1><p>Blur the full image and restore the center area to approximate subject isolation.</p></div></section>
    <section class="tool-shell"><div class="container tool-layout">
      <div class="tool-panel">
        <h2>Upload Image</h2>
        <div id="blurBackgroundDrop" class="upload-zone"><div><strong>Choose an image</strong><span>Center 60% remains sharp</span></div></div>
        <input id="blurBackgroundInput" class="hidden-input" type="file" accept="image/*">
        <div class="controls">
          <div class="form-group"><label for="blurStrength">Blur strength: <span id="blurStrengthValue">8px</span></label><input id="blurStrength" type="range" min="0" max="30" value="8"></div>
          <button id="blurBackgroundDownload" class="btn" type="button">Download Image</button>
        </div>
      </div>
      <div class="preview-panel"><h2>Preview</h2><div class="preview-area"><canvas id="blurBackgroundCanvas"></canvas></div><div class="status-box"><strong id="blurBackgroundStatus">No image selected.</strong></div></div>
    </div></section>
  </main>
  <footer class="site-footer"><div class="container">© 2025 Visafy. All rights reserved.</div></footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
